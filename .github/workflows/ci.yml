name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Validate source and run Node tests
        run: npm run check

      - name: Run Chromium accessibility and interaction tests
        run: npm run test:browser

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build deterministic H5P packages
        shell: powershell
        run: ./tools/package.ps1

      - name: Validate H5P package structure and checksums
        shell: powershell
        run: ./tools/validate-packages.ps1

      - name: Scan public tree and generated archives
        shell: powershell
        run: ./tools/scan-public.ps1 -Root .
